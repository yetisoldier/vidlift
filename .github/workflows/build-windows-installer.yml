name: build-windows-installer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Stage FFmpeg
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-8.1.zip" -OutFile $zip -TimeoutSec 600
          Expand-Archive $zip "$env:RUNNER_TEMP\ffmpeg" -Force
          $bin = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Directory | Where-Object Name -eq "bin" | Select-Object -First 1
          if (-not $bin) { throw "FFmpeg bin directory not found" }
          New-Item -ItemType Directory -Force packaging\tools | Out-Null
          Copy-Item "$($bin.FullName)\ffmpeg.exe" packaging\tools\ffmpeg.exe
          Copy-Item "$($bin.FullName)\ffprobe.exe" packaging\tools\ffprobe.exe
          & packaging\tools\ffmpeg.exe -hide_banner -version
          & packaging\tools\ffprobe.exe -hide_banner -version

      - name: Stage Real-ESRGAN
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\realesrgan.zip"
          Invoke-WebRequest -Uri "https://github.com/xinntao/Real-ESRGAN-ncnn-vulkan/releases/download/v0.2.0/realesrgan-ncnn-vulkan-v0.2.0-windows.zip" -OutFile $zip -TimeoutSec 600
          Expand-Archive $zip "$env:RUNNER_TEMP\realesrgan" -Force
          $source = Get-ChildItem "$env:RUNNER_TEMP\realesrgan" -Recurse -Directory | Where-Object { Test-Path (Join-Path $_.FullName "realesrgan-ncnn-vulkan.exe") } | Select-Object -First 1
          if (-not $source) { throw "Real-ESRGAN executable not found" }
          $target = "packaging\tools\realesrgan"
          New-Item -ItemType Directory -Force "$target\models" | Out-Null
          Copy-Item "$($source.FullName)\realesrgan-ncnn-vulkan.exe" "$target\realesrgan-ncnn-vulkan.exe"
          Get-ChildItem $source.FullName -File | Where-Object Extension -in ".dll", ".txt" | Copy-Item -Destination $target
          Copy-Item packaging\models\realesrgan-x2plus.param "$target\models\"
          Copy-Item packaging\models\realesrgan-x2plus.bin "$target\models\"
          Copy-Item packaging\models\realesr-animevideov3-x2.param "$target\models\"
          Copy-Item packaging\models\realesr-animevideov3-x2.bin "$target\models\"
          $paramHash = (Get-FileHash "$target\models\realesrgan-x2plus.param" -Algorithm SHA256).Hash.ToLower()
          $binHash = (Get-FileHash "$target\models\realesrgan-x2plus.bin" -Algorithm SHA256).Hash.ToLower()
          if ($paramHash -ne "f26dc4b8d7c467a86fac91f63d361a762ef5ab13ccb0521d3081b1b3152e9a6f") { throw "Real-ESRGAN param hash mismatch" }
          if ($binHash -ne "cfb044e3a1fe18750f54f7a3d8c2d49a296b54e2c9489c90513bbf88844e9e69") { throw "Real-ESRGAN bin hash mismatch" }
          $animeParamHash = (Get-FileHash "$target\models\realesr-animevideov3-x2.param" -Algorithm SHA256).Hash.ToLower()
          $animeBinHash = (Get-FileHash "$target\models\realesr-animevideov3-x2.bin" -Algorithm SHA256).Hash.ToLower()
          if ($animeParamHash -ne "b88ff4f00ebf019a7fdac17fdd45a7fd3665d37509efc5baf2e4da2e24420a04") { throw "Real-ESRGAN anime param hash mismatch" }
          if ($animeBinHash -ne "548a36f9c3f4ab8da56cd3b13badf23968bee207b396dad14d04b830e5f2ab2d") { throw "Real-ESRGAN anime bin hash mismatch" }

      - name: Stage unattended subtitle OCR
        shell: pwsh
        run: |
          $seZip = "$env:RUNNER_TEMP\seconv.zip"
          Invoke-WebRequest -Uri "https://github.com/SubtitleEdit/subtitleedit/releases/download/v5.2.0/SeConv-Windows-x64.zip" -OutFile $seZip -TimeoutSec 600
          Expand-Archive $seZip "$env:RUNNER_TEMP\seconv" -Force
          New-Item -ItemType Directory -Force packaging\tools\SubtitleEdit | Out-Null
          Copy-Item "$env:RUNNER_TEMP\seconv\*" packaging\tools\SubtitleEdit\ -Recurse -Force
          $tessZip = "$env:RUNNER_TEMP\tesseract.zip"
          Invoke-WebRequest -Uri "https://github.com/SubtitleEdit/support-files/releases/download/tesseract553/Tesseract553.zip" -OutFile $tessZip -TimeoutSec 600
          Expand-Archive $tessZip "$env:RUNNER_TEMP\tesseract" -Force
          $tessTarget = "packaging\tools\SubtitleEdit\Tesseract"
          New-Item -ItemType Directory -Force "$tessTarget\tessdata" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\tesseract\*" "$tessTarget\" -Recurse -Force
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/tesseract-ocr/tessdata/4.1.0/eng.traineddata" -OutFile "$tessTarget\tessdata\eng.traineddata" -TimeoutSec 600
          if (-not (Test-Path packaging\tools\SubtitleEdit\seconv.exe)) { throw "seconv.exe missing" }
          if (-not (Test-Path "$tessTarget\tesseract.exe")) { throw "tesseract.exe missing" }

      - name: Install Python build tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # av 14.3/14.4 ship no Windows wheels (sdist only) and the MSVC
          # sdist build fails on this runner (no ffmpeg 7 dev headers).
          # Pin av to the newest wheel-available release under the av<15
          # cap (14.2.0 has a cp312 win_amd64 wheel) so pip can never pick
          # an sdist av; --only-binary makes any wheel miss fail loudly.
          # av 14.2.0 satisfies faster-whisper 1.2.1 (av>=11).
          python -m pip install --only-binary :all: "av==14.2.0"
          python -m pip install -e . pytest pyinstaller

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_windows_packaging.py tests/test_gui.py

      - name: Stamp executable version
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "VIDLIFT_VERSION=$version" | Out-File $env:GITHUB_ENV -Append
          $parts = $version.Split(".")
          $file = "packaging\version_info.txt"
          $body = Get-Content $file -Raw
          $body = $body -replace "filevers=\(\d+, \d+, \d+, \d+\)", "filevers=($($parts[0]), $($parts[1]), $($parts[2]), 0)"
          $body = $body -replace "prodvers=\(\d+, \d+, \d+, \d+\)", "prodvers=($($parts[0]), $($parts[1]), $($parts[2]), 0)"
          $body = $body -replace "StringStruct\('FileVersion', '[\d.]+'\)", "StringStruct('FileVersion', '$version')"
          $body = $body -replace "StringStruct\('ProductVersion', '[\d.]+'\)", "StringStruct('ProductVersion', '$version')"
          Set-Content $file $body -NoNewline

      - name: Build GUI and CLI executables
        shell: pwsh
        run: |
          pyinstaller vidlift_gui.spec --noconfirm
          pyinstaller vidlift_cli.spec --noconfirm
          if (-not (Test-Path dist\VidLift\VidLift.exe)) { throw "GUI executable missing" }
          if (-not (Test-Path dist\vidlift-cli.exe)) { throw "CLI executable missing" }
          $ver = (& dist\vidlift-cli.exe --version | Out-String).Trim()
          Write-Output "cli-version: $ver"
          # (CI derivation): the version derives from $env:VIDLIFT_VERSION
          # (written from pyproject.toml at the stamp step, strictly
          # before this step) — a literal here is the drift class that
          # cost two releases; the repo-side gate
          # (test_workflow_has_no_version_literals) now forbids it.
          if ($ver -ne "vidlift $env:VIDLIFT_VERSION") { throw "CLI smoke failed: got '$ver', expected 'vidlift $env:VIDLIFT_VERSION'" }
          # VAD packaging gate (ADR-4): the frozen payload must carry faster-whisper's VAD asset
          # set. Two proofs, cheapest-first: (1) the one-folder GUI tree's
          # _internal\faster_whisper\assets matches the build venv's faster_whisper\assets
          # 1:1 by name+size (dynamic derivation from the venv — the leaf name is
          # version-suffixed upstream, so the gate hardcodes NO leaf); (2) the frozen CLI
          # reports its own capability through faster-whisper's OWN loader (--selftest).
          $fwAssets = (& python -c "import faster_whisper, os; print(os.path.join(os.path.dirname(faster_whisper.__file__), 'assets'))").Trim()
          $distAssets = "dist\VidLift\_internal\faster_whisper\assets"
          if (-not (Test-Path $distAssets)) { throw "frozen GUI tree missing faster_whisper assets dir: $distAssets" }
          $expected = Get-ChildItem $fwAssets -File | Sort-Object Name
          $shipped  = Get-ChildItem $distAssets -File | Sort-Object Name
          $missing = Compare-Object ($expected.Name) ($shipped.Name) | Where-Object SideIndicator -eq "<="
          if ($missing) { throw "frozen tree missing asset files: $(($missing | ForEach-Object InputObject) -join ', ')" }
          foreach ($f in $expected) {
            $twin = Join-Path $distAssets $f.Name
            if ((Get-Item $twin).Length -ne $f.Length) { throw "asset size mismatch: $($f.Name)" }
          }
          $shippedOnnx = @($shipped | Where-Object Extension -eq ".onnx")
          if ($shippedOnnx.Count -lt 1) { throw "frozen tree ships no *.onnx under $distAssets" }
          Write-Output "vad assets shipped: $(($shipped.Name) -join ', ')"
          & dist\vidlift-cli.exe --selftest | Tee-Object dist\selftest-cli.json
          if ($LASTEXITCODE -ne 0) { throw "frozen CLI --selftest failed — see dist\selftest-cli.json" }

      - name: PE stamp check
        shell: pwsh
        run: |
          foreach ($f in @('dist\VidLift\VidLift.exe','dist\vidlift-cli.exe')) {
            $vi = (Get-Item $f).VersionInfo
            Write-Output ("PE {0}: FileVersion={1} ProductVersion={2}" -f $f, $vi.FileVersion, $vi.ProductVersion)
            if ($vi.FileVersion -ne $env:VIDLIFT_VERSION -or $vi.ProductVersion -ne $env:VIDLIFT_VERSION) { throw "PE stamp wrong on $f" }
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler missing" }
          & $iscc "/DMyAppVersion=$env:VIDLIFT_VERSION" packaging\vidlift.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup build failed" }
          $setup = "output\VidLift-$env:VIDLIFT_VERSION-Windows-x64-Setup.exe"
          if (-not (Test-Path $setup)) { throw "Installer missing" }

      - name: Validate installed artifact
        shell: pwsh
        run: |
          $setup = (Resolve-Path "output\VidLift-$env:VIDLIFT_VERSION-Windows-x64-Setup.exe").Path
          $install = "$env:RUNNER_TEMP\VidLift-installed"
          $process = Start-Process $setup -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$install") -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer exited $($process.ExitCode)" }
          foreach ($file in @(
            "$install\VidLift.exe",
            "$install\vidlift-cli.exe",
            "$install\tools\ffmpeg.exe",
            "$install\tools\ffprobe.exe",
            "$install\tools\realesrgan\realesrgan-ncnn-vulkan.exe",
            "$install\tools\realesrgan\models\realesrgan-x2plus.param",
            "$install\tools\realesrgan\models\realesrgan-x2plus.bin",
            "$install\tools\realesrgan\models\realesr-animevideov3-x2.param",
            "$install\tools\realesrgan\models\realesr-animevideov3-x2.bin",
            "$install\tools\SubtitleEdit\seconv.exe",
            "$install\tools\SubtitleEdit\Tesseract\tesseract.exe",
            "$install\tools\SubtitleEdit\Tesseract\tessdata\eng.traineddata"
          )) {
            if (-not (Test-Path $file)) { throw "Installed payload missing: $file" }
          }
          # VAD packaging gate (ADR-4): the INSTALLED payload must carry the VAD asset set — the
          # same dynamic parity rule as the dist-tree gate (the installer, not merely the
          # build, is what users run). Re-derive the build venv's asset list here: each
          # pwsh step is its own process, so step-self-contained re-derivation wins over
          # cross-step variable sharing.
          $fwAssets = (& python -c "import faster_whisper, os; print(os.path.join(os.path.dirname(faster_whisper.__file__), 'assets'))").Trim()
          $expected = Get-ChildItem $fwAssets -File | Sort-Object Name
          $instAssets = "$install\_internal\faster_whisper\assets"
          if (-not (Test-Path $instAssets)) { throw "Installed payload missing faster_whisper assets dir: $instAssets" }
          $installed = Get-ChildItem $instAssets -File | Sort-Object Name
          $missingInst = Compare-Object ($expected.Name) ($installed.Name) | Where-Object SideIndicator -eq "<="
          if ($missingInst) { throw "installed payload missing asset files: $(($missingInst | ForEach-Object InputObject) -join ', ')" }
          foreach ($f in $expected) {
            $twin = Join-Path $instAssets $f.Name
            if ((Get-Item $twin).Length -ne $f.Length) { throw "installed asset size mismatch: $($f.Name)" }
          }
          Write-Output "installed vad assets: $(($installed.Name) -join ', ')"
          & "$install\vidlift-cli.exe" --selftest | Tee-Object "$install\selftest-cli.json"
          if ($LASTEXITCODE -ne 0) { throw "installed CLI --selftest failed — see $install\selftest-cli.json" }
          & "$install\vidlift-cli.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Installed CLI failed" }
          & "$install\tools\ffprobe.exe" -hide_banner -version
          if ($LASTEXITCODE -ne 0) { throw "Installed ffprobe failed" }
          $gui = Start-Process "$install\VidLift.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($gui.HasExited) { throw "Installed GUI exited during launch smoke test" }
          Stop-Process -Id $gui.Id -Force

      - name: Hash installer
        shell: pwsh
        run: |
          $setup = "output\VidLift-$env:VIDLIFT_VERSION-Windows-x64-Setup.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $setup -Leaf)" | Set-Content "$setup.sha256"

      - name: Upload build artifact (no publish; staging handled off-runner)
        uses: actions/upload-artifact@v4
        with:
          name: vidlift-${{ env.VIDLIFT_VERSION }}-windows-installer
          path: |
            output/VidLift-${{ env.VIDLIFT_VERSION }}-Windows-x64-Setup.exe
            output/VidLift-${{ env.VIDLIFT_VERSION }}-Windows-x64-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 7
