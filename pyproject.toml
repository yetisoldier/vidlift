[project]
name = "vidlift"
version = "0.1.0"
description = "Batch AI upscaler for SD video files (AVI/XviD/DivX, MP4, MOV, MKV, WMV, FLV, MPEG) to 720p HEVC MP4"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyQt6>=6.7"]

[project.scripts]
vidlift = "vidlift.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vidlift"]

[tool.pytest.ini_options]
testpaths = ["tests"]