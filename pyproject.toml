[project]
name = "vidlift"
version = "0.4.24.0"
description = "Batch AI upscaler for SD video files (AVI/XviD/DivX, MP4, MOV, MKV, WMV, FLV, MPEG) to 720p HEVC MP4"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyQt6>=6.7", "faster-whisper>=1.2", "av<15"]

[project.scripts]
vidlift = "vidlift.cli:main"
vidlift-cli = "vidlift.cli:main"
vidlift-gui = "vidlift.gui:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vidlift", "vidlift.*"]

[tool.setuptools.package-data]
"vidlift.ui" = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: real-ffmpeg/engine integration tests (deselect with: -m 'not slow')",
]